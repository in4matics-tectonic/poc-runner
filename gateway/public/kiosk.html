<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KBC Momentum</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/kiosk.css" />
<script src="/config.js"></script>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="kiosk">
  <section class="story" aria-live="polite">
    <p class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 22l5-7 4 4 7-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>KBC <b>Momentum</b></span>
    </p>

    <div class="copy" id="copy">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="moment" id="moment">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="52"/>
          <circle class="arc" id="arc" cx="60" cy="60" r="52" pathLength="100"/>
        </svg>
        <b id="score">0%</b>
      </div>
      <div class="m-info">
        <p class="m-name">Levensmoment · <span>een kindje op komst</span></p>
        <ol class="fases" id="fases">
          <li data-f="stil">Stil</li>
          <li data-f="info">Kate merkt iets</li>
          <li data-f="vragen">Kate vraagt</li>
          <li data-f="voorstel">Voorstel</li>
        </ol>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </section>

  <section class="device" aria-label="De KBC Mobile-app, live">
    <div class="float" id="float">
      <div class="phone" id="phone"><iframe title="KBC Mobile" tabindex="-1"></iframe></div>
      <span class="live"><i></i>Live: de echte app</span>
    </div>
  </section>
</main>

<footer class="cta">
  <span class="cta-main"><i></i>Benieuwd hoe het werkt? <b>Vraag ons een live demo.</b></span>
  <ol class="beats" id="beats" aria-hidden="true"></ol>
</footer>

<script src="/kiosk.js"></script>
</body>
</html>
