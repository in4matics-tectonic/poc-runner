# Static single-page app + same-origin API proxy. Shared by the app and the backoffice.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000/health;
  }

  # Build output with a content hash in the name (Vite /assets, Expo /assets and /_expo/static): cache for good
  location ~ ^/(assets|_expo/static)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # HTML must be revalidated, or browsers keep loading the previous build after a deploy
    add_header Cache-Control "no-cache";
    # Expo static export writes /route.html; Vite has a single index.html
    try_files $uri $uri.html $uri/ /index.html;
  }
}
